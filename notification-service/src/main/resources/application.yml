spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/piggy_notification}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
server:
  servlet:
    context-path: /notifications
cognito:
  issuer: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/local}
  browser-client-id: ${COGNITO_BROWSER_CLIENT_ID:local-browser}
  service-client-id: ${COGNITO_SERVICE_CLIENT_ID:local-service}
  # Supplied from the Parameter Store SecureString document in AWS.
  service-client-secret: ${COGNITO_SERVICE_CLIENT_SECRET:local-only}
  service-scope: ${COGNITO_SERVICE_SCOPE:piggymetrics/server}
  token-uri: ${COGNITO_TOKEN_URI:https://localhost/oauth2/token}
services:
  base-url: ${SERVICES_BASE_URL:http://localhost:8080}
notifications:
  from: ${SMTP_FROM:no-reply@example.invalid}
remind:
  email:
    text: "Hey, {0}! We''ve missed you here on PiggyMetrics. It''s time to check your budget statistics.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics reminder
backup:
  email:
    text: "Howdy, {0}. Your account backup is ready.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics account backup
    attachment: backup.json
