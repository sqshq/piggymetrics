# Configuración compartida por las suites de la capa de datos (com.piggymetrics.account.data).
# MongoDB embebido con la misma versión que la imagen de producción (sqshq/piggymetrics-mongodb -> mongo:3 -> 3.6.23).
spring.mongodb.embedded.version=3.6.23
# MongoDB 3.6 ya no acepta --nohttpinterface; esta feature evita que flapdoodle lo pase.
spring.mongodb.embedded.features=SYNC_DELAY,NO_HTTP_INTERFACE_ARG
# Sin config server: la prueba no debe depender de otro servicio.
spring.cloud.config.enabled=false
logging.level.root=WARN
logging.level.org.mongodb.driver=ERROR
